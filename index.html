
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melkamu Web Design</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5ff;
            text-align: center;
            padding: 40px 15px;
        }

        .card {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            color: #12304a;
        }

        a {
            display: inline-block;
            background: #176b87;
            color: white;
            padding: 12px 18px;
            border-radius: 7px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Melkamu Web Design</h1>
        <p>Welcome to my first website!</p>
        <p>I create websites for businesses and schools.</p>
        <a href="mailto:hello@example.com">Contact Me</a>
    </div>
</body>
</html>
